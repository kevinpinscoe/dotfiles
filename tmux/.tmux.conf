# --- General ---
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -g set-clipboard external
set -ag terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
set -ag terminal-overrides ',ghostty*:Ms=\E]52;%p1%s;%p2%s\007'
set -ag terminal-overrides ',tmux*:Ms=\E]52;%p1%s;%p2%s\007'
set -g history-limit 50000
set -g mouse on

# --- Copy mode ---
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# --- Bell / attention ---
set -g bell-action none
set -g visual-bell off

# --- Status bar ---
set -g status 2
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-left-length 30

set -g status-right ""
set -g status-right-length 0

set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g window-status-format "#[default] #I:#W "

# Bottom status line: per-repo .workingon (left) + pane-context info (right)
set -g status-format[1] "#[align=left] #(~/.config/tmux/status/workingon.sh #{pane_current_path})#[align=right]#(~/.config/tmux/status/git.sh #{pane_current_path}) #[fg=#45475a]│#[default] #(~/.config/tmux/status/aws.sh) #[fg=#45475a]│#[default] #(~/.config/tmux/status/k8s.sh) #[fg=#45475a]│#[default] #(~/.config/tmux/status/cwd.sh #{pane_current_path}) #[fg=#45475a]│#[default] #[fg=#f38ba8]%H:%M "

# --- Session management ---
# H: key binding cheatsheet
bind h display-popup -E -w 62 -h 45 "$HOME/.config/tmux/cheatsheet.sh"

# S: fzf session picker (popup) — shows all sessions, last-connected time, live pane preview
bind S display-popup -E -w 90% -h 85% "$HOME/.config/tmux/scripts/session-picker.sh"

# D: session dashboard — box-grid overview, auto-refreshes every 3s, q to exit
bind D new-window -n "sessions" "$HOME/.config/tmux/scripts/session-dashboard.sh"

# N: create a new named session (prompts for name)
bind N command-prompt -p "New session name:" "new-session -d -s '%%'"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'Ataraxy-Labs/opensessions'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Session persistence ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# copy.sh handles platform detection (\r stripping, macOS vs RPi5)
set -g @override_copy_command '~/.config/tmux/copy.sh'

# Double/triple-click must explicitly name the copy command; tmux-yank's
# root-table bindings use bare copy-pipe-and-cancel which skips the override.
bind -T root DoubleClick1Pane \
  select-pane -t = \; \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "~/.config/tmux/copy.sh" }

bind -T root TripleClick1Pane \
  select-pane -t = \; \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "~/.config/tmux/copy.sh" }

# Ensure tpm (and its child shells) can find `tmux`, `git`, etc. regardless of
# how the tmux server was launched. Covers Homebrew (Mac ARM/Intel) and the
# standard Linux dirs used on Fedora and Debian/RPi. Missing dirs are harmless.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin:/home/kinscoe/.bun/bin"

run '~/.tmux/plugins/tpm/tpm'
